# Tests every push and pull request: the desktop half (the tests, clippy, the dependencies) and the
# browser half (the build, then the smoke test in headless Chromium, with the real headers). The
# build it tested is kept, for deploy.yml to put live by hand. Nothing here deploys.
# Third-party actions are pinned to a commit, with the release it is in a comment (Dependabot
# keeps both up to date).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Clippy warnings there are already; more fails the run (CLAUDE.md, "Done means").
  CLIPPY_WARNINGS_ALLOWED: 15

jobs:
  desktop:
    name: "Desktop: tests, clippy, dependencies"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust, stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop
      - name: The fonts the tests measure pages with
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation
      - name: Tests
        run: cargo test --locked
      # The tests play each theme of themes/ from its source, never its module (R36): so the
      # modules checked in must be what those sources build to, byte for byte.
      - name: Theme programs' modules are their sources built (R36)
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          themes/build.sh
          git diff --exit-code --stat -- tests/fixtures
      - name: Clippy, with no warnings beyond those already there
        run: |
          set +e
          out=$(cargo clippy --locked --all-targets 2>&1)
          status=$?
          set -e
          echo "$out" | grep -E "^(warning|error)" | sort | uniq -c
          [ $status -eq 0 ] || { echo "clippy failed"; exit 1; }
          n=$(echo "$out" | grep -oE 'generated [0-9]+ warnings?' | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "clippy: ${n:-0} warnings, ${CLIPPY_WARNINGS_ALLOWED} allowed"
          [ "${n:-0}" -le "$CLIPPY_WARNINGS_ALLOWED" ] || { echo "$out"; exit 1; }
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - name: Dependencies (vulnerabilities, licences, sources; deny.toml)
        run: cargo deny --locked check

  browser:
    name: "Browser: build, smoke test"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust, the nightly web/build.sh names
        run: |
          toolchain=$(grep -oE 'nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}' web/build.sh)
          rustup toolchain install "$toolchain" --profile minimal --component rust-src --target wasm32-unknown-unknown
          echo "NIGHTLY=$toolchain" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: browser
      # The build runs offline, so that it fetches nothing not decided beforehand: what it is built
      # from is fetched here, the app's crates (Cargo.lock) and those the standard library is built
      # from (its own Cargo.lock, in rust-src).
      - name: Fetch the crates, then build offline
        run: |
          cargo +"$NIGHTLY" fetch --locked
          cargo +"$NIGHTLY" fetch --locked --manifest-path "$(rustc +"$NIGHTLY" --print sysroot)/lib/rustlib/src/rust/library/Cargo.toml"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: trunk@0.22.1,wasm-bindgen@0.2.130
      # The compiler theme programs are built with in the writer's tab (R36): the release of the
      # investigation's toolchain that toolchain/release.json pins, each file checked against its
      # pin; rustup's 1.99.1 for the std and the SDK it is packed with, and for the brotli decoder;
      # brotli for the pieces. What brotli made (minutes, at its best) is kept between runs by what
      # it was made of: a cache gone only makes the build slower.
      - name: The compiler for theme programs (rustup 1.99.1, brotli, the pinned release)
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.99.1 fetch --locked --manifest-path toolchain/unbrotli/Cargo.toml
          sudo apt-get install -y --no-install-recommends brotli || { sudo apt-get update && sudo apt-get install -y --no-install-recommends brotli; }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/toolchain
          key: toolchain-${{ hashFiles('toolchain/**', 'theme-sdk/**') }}
          restore-keys: toolchain-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Node tools (Playwright, Wrangler), without running their install scripts
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Stories API, in the Workers runtime (Miniflare)
        working-directory: web
        run: node --test api/api.test.mjs
      - name: Theme programs' host in the browser makes the words the tests' player makes (R36)
        working-directory: web
        run: node --test theme-worker.test.mjs
      - name: Chromium for the smoke test
        working-directory: web
        # The browser alone, in seconds. The runner has the libraries Chromium needs; --with-deps
        # added fonts and Mesa from Ubuntu's mirrors, which the smoke test needs none of (Caprice
        # draws with its own fonts, Chromium with its own SwiftShader), and the mirrors were often so
        # slow that it waited five minutes for them before going on without.
        run: npx playwright-core install chromium
      - name: Build
        run: |
          node toolchain/fetch.mjs
          ./web/build.sh
      - name: Every file fits Cloudflare's 25 MiB a file
        run: |
          echo "the .wasm: $(( $(stat -c %s web/dist/*_bg.wasm) / 1048576 )) MiB; all of it: $(du -sm web/dist | cut -f1) MiB"
          big=$(find web/dist -type f -size +25599k)
          [ -z "$big" ] || { echo "over 25 MiB: $big"; exit 1; }
      - name: Smoke test, served with the headers readers get
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          node web/serve.mjs 8080 &
          sleep 1
          node web/smoke.mjs "$RUNNER_TEMP/smoke"
      - name: Screenshots, if it failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke/*.png
          retention-days: 7
      - name: Keep the tested build, for deploy.yml
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          retention-days: 30
