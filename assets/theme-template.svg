<?xml version="1.0" encoding="UTF-8"?>
<!--
  A Caprice theme: one drawing. Change anything, keep the names, and import it from
  Page › Theme › Yours › Import a theme…

  THE DESK (required). The group named "desk" is the picture the pages lie on. It covers the
  whole desk whatever the window's shape: cut to fit, its foot kept. Draw it wide (this one is
  1920 × 1080). The page lies over the middle, so what matters, and what moves, goes to the
  left and the right.

  WHAT MOVES. Give a part an id (or, in Inkscape, a name in the Layers and Objects panel) saying
  how it moves. N is any number, to tell parts apart; X,Y are in the drawing's units, or in those
  of the group the part is drawn in (0,0 is the group's origin there).
    move-drift-N        a cloud or mist, drifting sideways
    move-sway-N-X-Y     a tree, reeds or a flag, swaying about its foot at X,Y
    move-wing-N-X-Y     a wing, beating about its shoulder at X,Y
    move-spin-N-X-Y     sails or a wheel, turning round X,Y (inside it)
    move-float-N        a boat or a lantern, bobbing
    move-wander-N       a fish or a butterfly, going about a little loop
    move-twinkle-N      a star
    move-flicker-N      a lit window, a flame
    move-pulse-N        a glow, brighter and dimmer
    move-shimmer-N      glints on water
    move-smoke-N-X-Y    an empty group: smoke rises from X,Y
    move-snow-N, move-rain-N, move-fireflies-N, move-leaves-N, move-bubbles-N, move-embers-N
                        a rectangle where they fall or rise, filled with their colour
  The desk needs at least two parts that move.

  WHAT GROWS (optional). The group named "piece" is one thing (a tower, a tree, a pile), drawn
  close together: Caprice stands one beside the pages for each chapter, wherever it is drawn.
  Each page of the chapter shows one more stage: the groups stage-1, stage-2, … (up to 24), or
  without them its parts in the order drawn. A stage holds only what it adds, never the stages
  before it again: those stay shown. The group "done" shows once the next chapter begins.
  Several pieces, piece-1, piece-2, …, take turns.
  Or, with "layout": "drawn", the piece stays just where it is drawn on the desk, one for the whole
  story: every page of the story adds a stage (a coconut on the beach, a star in the sky), and its
  "done" shows once every stage has come. Then it may be spread over the whole picture.
  With "layout": "drawn" and "each": "chapter", each chapter has its own piece where it is drawn
  (piece-1 on one tree, piece-2 on another): a stage a page, and when the next chapter begins,
  its "done", or with "finish": "fall" its stages fall to the ground and lie there.
  "order": "random" gives each chapter a piece at random (never the one before's).
  What is drawn in place on a part of the desk that moves (coconuts on a swaying palm) moves
  with it: draw it inside that part's group, or just over it.

  WHAT BRINGS A NEW CHAPTER TITLE (optional). The group named "carrier" flies in with the title
  hanging from the little mark named "hook" (or from its foot). Its wings beat if marked.

  SETTINGS. The JSON below, all of it optional:
    name, about, author
    palette   colours to use rather than those taken from the picture: desk, desk_top, dock,
              dock_edge, button, button_hover, text, text_hot, text_dim, accent, on_accent, field,
              caret, thumb; and "light": "yes" or "no"
    growth    layout ("row", "scatter" or "drawn"), arrive (how a stage comes: "light", out of a
              little light; "fall", dropping from above; "grow", rising from its foot), each
              ("story" or "chapter", for "drawn"), order ("turn" or "random"), finish ("done", or
              "fall": the stages fall to the ground), size (a share of the picture's height),
              ground (the y the pieces stand on, or fall to, in the drawing's units), mirror
              (true: those right of the page face it)
    carrier   faces: the way its head points as drawn, "left" or "right" (Caprice turns it to fly
              head first, so a wrong one has it flying backwards); size (1 is the usual)
    anchor    "bottom", "middle" or "top": which edge of the picture is kept when it is cut

  Text is not shown (turn it into paths), and pictures must be in the file itself.

  FOR WHOEVER MAKES ONE, A PERSON OR AN AI: FIRST CHOOSE WHAT GROWS, THEN DRAW IT.
  There are two kinds, and the idea decides which:
    One thing for each chapter, built up page by page (a lighthouse, a ship, a tree, a house):
      "layout": "row" (or "scatter"). Draw ONE such thing, small and close together, anywhere;
      Caprice places a copy beside the page for each chapter. This template is of this kind.
    Things that gather on the desk where you put them, one for every page of the story
      (coconuts on a beach, stars in the sky, shells, flowers in a meadow, boats in a bay):
      "layout": "drawn". Draw each where it should lie, in the desk's own units; with
      "arrive": "fall" for what drops (coconuts, apples, snow), "grow" for what comes up.
    Things that grow on something in the picture during a chapter, and leave it when the next
      begins (coconuts on a palm that fall to the sand, apples on a tree, lights in a window):
      "layout": "drawn", "each": "chapter", "finish": "fall" (or "done"), and "order": "random"
      if any of several should take its turn. Draw one piece on each tree (piece-1, piece-2, …),
      inside the tree's swaying group or over it, with "arrive": "grow"; "ground" is where they
      fall to.
  An example of the second kind, three coconuts that fall onto the sand, page by page, and a
  crab that comes out once all three lie there:
    <metadata id="caprice">{ "growth": { "layout": "drawn", "arrive": "fall" } }</metadata>
    <g id="piece">
      <g id="stage-1"><circle cx="300" cy="930" r="16" fill="#6b4226"/></g>
      <g id="stage-2"><circle cx="1500" cy="940" r="16" fill="#6b4226"/></g>
      <g id="stage-3"><circle cx="420" cy="955" r="16" fill="#6b4226"/></g>
      <g id="done"><ellipse cx="1620" cy="950" rx="22" ry="12" fill="#e0533a"/></g>
    </g>
  Each stage holds only the one new thing, never those before it (stage-2 has one coconut,
  not two). The drawing still needs its moving desk, and the coconuts on the trees may stay in
  the desk as they are: the ones that fall are the piece's.

  WHAT SHOWS. On a usual screen the page covers about x 620 to 1300 of a 1920-wide drawing, and
  the bar along the bottom about the lowest 60 units: put what grows and what moves between x 0
  and 600 or 1320 and 1920, above y 1010. On a narrower screen (4:3) the edges are cut too, so
  the best of it is between x 240 and 600, and 1320 and 1680.

  MISTAKES SEEN BEFORE.
    A "row" piece spread over the whole beach: it becomes a long strip, shrunk beside the page.
    Use "drawn" for that.
    Each stage repeating the stages before it.
    A move-wing or move-sway point far from its part: write it where the shoulder or foot is.
    A carrier's "faces" not the way its head points as drawn: it flies backwards.
    Coconuts that should fall at a new chapter drawn again on the ground as "done": with
    "finish": "fall" the ones on the tree fall there themselves.
  When a theme is imported, Caprice says what it found and what to fix, in plain words.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <metadata id="caprice">{
    "name": "Moonlit Bay",
    "about": "A quiet bay at night, and a light for every chapter",
    "author": "Caprice",
    "palette": { "accent": "#ffcf7a" },
    "growth": { "layout": "row", "size": 0.26, "ground": 990 },
    "carrier": { "faces": "left", "size": 1.1 }
  }</metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1430"/>
      <stop offset="0.45" stop-color="#1d2858"/>
      <stop offset="0.78" stop-color="#4f4677"/>
      <stop offset="1" stop-color="#b9787a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f72"/>
      <stop offset="1" stop-color="#121838"/>
    </linearGradient>
    <linearGradient id="shore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#f3e6c0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f3e6c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#fff2b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- THE DESK -->
  <g id="desk">
    <rect width="1920" height="1080" fill="url(#sky)"/>

    <!-- Stars, each twinkling on its own. -->
    <circle id="move-twinkle-1" cx="120" cy="90" r="2.6" fill="#fff8e0"/>
    <circle id="move-twinkle-2" cx="262" cy="168" r="1.9" fill="#fff8e0"/>
    <circle id="move-twinkle-3" cx="398" cy="62" r="2.3" fill="#fff8e0"/>
    <circle id="move-twinkle-4" cx="540" cy="210" r="1.7" fill="#fff8e0"/>
    <circle id="move-twinkle-5" cx="1392" cy="214" r="1.8" fill="#fff8e0"/>
    <circle id="move-twinkle-6" cx="1466" cy="78" r="2.5" fill="#fff8e0"/>
    <circle id="move-twinkle-7" cx="1740" cy="300" r="1.9" fill="#fff8e0"/>
    <circle id="move-twinkle-8" cx="1846" cy="62" r="2.4" fill="#fff8e0"/>

    <!-- The moon, its halo glowing. -->
    <circle id="move-pulse-1" cx="1560" cy="170" r="150" fill="url(#halo)"/>
    <circle cx="1560" cy="170" r="54" fill="#f6efd6"/>
    <circle cx="1542" cy="158" r="9" fill="#e6dcbc"/>
    <circle cx="1578" cy="190" r="12" fill="#e9e0c4"/>
    <circle cx="1574" cy="146" r="5" fill="#e6dcbc"/>

    <!-- Clouds, drifting. -->
    <g id="move-drift-1" fill="#8d84b8" opacity="0.5">
      <ellipse cx="330" cy="270" rx="130" ry="22"/>
      <ellipse cx="290" cy="254" rx="70" ry="22"/>
      <ellipse cx="370" cy="250" rx="54" ry="18"/>
    </g>
    <g id="move-drift-2" fill="#9a8fbe" opacity="0.42">
      <ellipse cx="1480" cy="350" rx="150" ry="20"/>
      <ellipse cx="1530" cy="334" rx="72" ry="20"/>
    </g>

    <!-- The far hills, and the nearer. -->
    <path d="M0,700 L0,640 Q140,590 280,628 Q420,560 600,622 Q760,600 900,650 Q1060,590 1240,632 Q1400,575 1560,620 Q1740,585 1920,630 L1920,700 Z" fill="#2c2f5e"/>
    <path d="M0,720 L0,668 Q200,640 360,672 Q520,648 700,690 L1200,700 Q1380,650 1560,676 Q1760,646 1920,670 L1920,720 Z" fill="#22244a"/>

    <!-- The bay, and the moon's light on it. -->
    <rect y="700" width="1920" height="240" fill="url(#lake)"/>
    <g id="move-shimmer-1" fill="#f6efd6" opacity="0.55">
      <ellipse cx="1560" cy="730" rx="46" ry="2.5"/>
      <ellipse cx="1550" cy="752" rx="64" ry="2.5"/>
      <ellipse cx="1570" cy="778" rx="38" ry="2"/>
      <ellipse cx="1556" cy="806" rx="72" ry="2.5"/>
      <ellipse cx="1566" cy="838" rx="44" ry="2"/>
      <ellipse cx="1552" cy="868" rx="58" ry="2.5"/>
    </g>
    <g id="move-shimmer-2" fill="#c9c3e8" opacity="0.35">
      <ellipse cx="300" cy="760" rx="40" ry="2"/>
      <ellipse cx="420" cy="796" rx="56" ry="2"/>
      <ellipse cx="250" cy="842" rx="34" ry="2"/>
    </g>

    <!-- A little boat, bobbing on the water. -->
    <g id="move-float-1">
      <path d="M250,812 L370,812 Q358,836 328,838 L290,838 Q262,834 250,812 Z" fill="#3b2f3e"/>
      <rect x="308" y="728" width="4" height="86" fill="#2a2230"/>
      <path d="M314,734 L314,806 L364,806 Z" fill="#e8dfd0"/>
      <path d="M306,744 L306,806 L270,806 Z" fill="#cfc4b6"/>
    </g>

    <!-- The shore. -->
    <path d="M0,1080 L0,918 Q240,896 480,912 Q720,930 960,920 Q1220,908 1460,922 Q1700,934 1920,912 L1920,1080 Z" fill="url(#shore)"/>
    <path d="M0,1080 L0,990 Q300,972 620,986 Q960,1000 1300,984 Q1620,972 1920,990 L1920,1080 Z" fill="#0a101e"/>

    <!-- A cottage, its window lit and smoke rising from its chimney. -->
    <rect x="438" y="806" width="18" height="44" fill="#251f38"/>
    <g id="move-smoke-1-447-804"/>
    <path d="M326,860 L404,802 L482,860 Z" fill="#2a2342"/>
    <rect x="338" y="858" width="132" height="76" fill="#3a3352"/>
    <rect id="move-flicker-1" x="360" y="874" width="28" height="24" fill="#ffd27a"/>
    <rect x="412" y="882" width="24" height="52" fill="#1d1830"/>
    <path d="M300,934 Q400,926 500,936" stroke="#22304a" stroke-width="6" fill="none"/>

    <!-- Pines, swaying about their feet. -->
    <g id="move-sway-1-560-944">
      <rect x="554" y="904" width="12" height="40" fill="#1a1422"/>
      <path d="M510,912 L560,842 L610,912 Z" fill="#13301f"/>
      <path d="M520,872 L560,800 L600,872 Z" fill="#163824"/>
      <path d="M532,830 L560,760 L588,830 Z" fill="#1a4029"/>
    </g>
    <g id="move-sway-2-646-948">
      <rect x="641" y="916" width="10" height="32" fill="#1a1422"/>
      <path d="M608,922 L646,866 L684,922 Z" fill="#13301f"/>
      <path d="M616,890 L646,832 L676,890 Z" fill="#183a26"/>
    </g>
    <g id="move-sway-3-1690-946">
      <rect x="1684" y="902" width="12" height="44" fill="#1a1422"/>
      <path d="M1638,910 L1690,836 L1742,910 Z" fill="#13301f"/>
      <path d="M1648,868 L1690,792 L1732,868 Z" fill="#163824"/>
      <path d="M1660,824 L1690,752 L1720,824 Z" fill="#1a4029"/>
    </g>

    <!-- Reeds at the water's edge. -->
    <g id="move-sway-4-1556-930" stroke="#2d4a3a" stroke-width="3" fill="none">
      <path d="M1548,930 Q1544,900 1538,876"/>
      <path d="M1556,930 Q1556,894 1560,866"/>
      <path d="M1564,930 Q1570,902 1578,884"/>
    </g>

    <!-- A windmill, its sails turning. -->
    <path d="M1380,940 L1398,806 L1442,806 L1460,940 Z" fill="#3a3354"/>
    <path d="M1390,808 L1420,778 L1450,808 Z" fill="#2a2342"/>
    <rect id="move-flicker-2" x="1412" y="860" width="16" height="20" fill="#ffd27a"/>
    <g id="move-spin-1-1420-800">
      <path d="M1416,800 L1410,688 L1432,688 L1424,800 Z" fill="#d8cfbf"/>
      <path d="M1420,796 L1532,790 L1532,812 L1420,804 Z" fill="#cfc5b4"/>
      <path d="M1424,800 L1430,912 L1408,912 L1416,800 Z" fill="#d8cfbf"/>
      <path d="M1420,804 L1308,810 L1308,788 L1420,796 Z" fill="#cfc5b4"/>
      <circle cx="1420" cy="800" r="7" fill="#2a2342"/>
    </g>

    <!-- Fireflies over the grass, left and right of the page: only where and in what colour;
         Caprice draws them, and leaves the rectangle out. -->
    <rect id="move-fireflies-1" x="160" y="840" width="540" height="170" fill="#e8ff9a" opacity="0.12"/>
    <rect id="move-fireflies-2" x="1260" y="850" width="520" height="160" fill="#e8ff9a" opacity="0.12"/>
  </g>

  <!-- WHAT GROWS: a lighthouse for each chapter, a stage a page, lit when the next begins. -->
  <g id="piece">
    <g id="stage-1">
      <path d="M1680,1000 Q1696,962 1736,966 Q1764,948 1800,966 Q1832,968 1842,1000 Z" fill="#3d3a52"/>
      <path d="M1700,986 Q1722,972 1748,978" stroke="#55516c" stroke-width="4" fill="none"/>
    </g>
    <g id="stage-2">
      <path d="M1732,970 L1738,900 L1782,900 L1788,970 Z" fill="#ece7df"/>
      <rect x="1752" y="944" width="16" height="26" fill="#3b3550"/>
    </g>
    <path id="stage-3" d="M1738,900 L1741,862 L1779,862 L1782,900 Z" fill="#c8463d"/>
    <g id="stage-4">
      <path d="M1741,862 L1744,824 L1776,824 L1779,862 Z" fill="#ece7df"/>
      <rect x="1755" y="836" width="10" height="14" fill="#3b3550"/>
    </g>
    <path id="stage-5" d="M1744,824 L1746,794 L1774,794 L1776,824 Z" fill="#c8463d"/>
    <g id="stage-6">
      <rect x="1734" y="786" width="52" height="8" fill="#2b2a3c"/>
      <path d="M1738,786 L1738,774 M1750,786 L1750,774 M1770,786 L1770,774 M1782,786 L1782,774 M1736,774 L1784,774" stroke="#2b2a3c" stroke-width="3"/>
    </g>
    <g id="stage-7">
      <rect x="1746" y="752" width="28" height="34" fill="#2b2a3c"/>
      <rect x="1750" y="756" width="20" height="26" fill="#4b5a7c"/>
    </g>
    <g id="stage-8">
      <path d="M1742,752 L1760,728 L1778,752 Z" fill="#c8463d"/>
      <circle cx="1760" cy="726" r="4" fill="#2b2a3c"/>
    </g>
    <g id="done">
      <circle id="move-pulse-2" cx="1760" cy="769" r="64" fill="url(#lamp)"/>
      <rect x="1750" y="756" width="20" height="26" fill="#ffe08a"/>
      <path d="M1752,762 L1640,744 L1640,794 L1752,776 Z" fill="#fff3b8" opacity="0.28"/>
      <path d="M1768,762 L1880,744 L1880,794 L1768,776 Z" fill="#fff3b8" opacity="0.28"/>
    </g>
  </g>

  <!-- WHAT BRINGS A NEW CHAPTER TITLE: a gull, its wings beating, the title at its feet. -->
  <g id="carrier">
    <path id="move-wing-2-908-292" d="M908,292 L960,232 L994,240 L936,300 Z" fill="#bdb9d0"/>
    <path d="M946,298 L978,284 L976,314 Z" fill="#d9d6e6"/>
    <ellipse cx="900" cy="300" rx="48" ry="18" fill="#ecebf4"/>
    <circle cx="852" cy="290" r="15" fill="#f4f3fa"/>
    <path d="M838,288 L816,295 L838,298 Z" fill="#f0b040"/>
    <circle cx="848" cy="286" r="2.5" fill="#1d1830"/>
    <path d="M892,316 L896,334 M906,316 L904,334" stroke="#f0b040" stroke-width="3"/>
    <path id="move-wing-1-894-296" d="M894,296 L866,228 L900,218 L926,296 Z" fill="#f7f6fc"/>
    <circle id="hook" cx="900" cy="336" r="2"/>
  </g>
</svg>
