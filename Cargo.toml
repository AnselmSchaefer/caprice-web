[package]
name = "caprice-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23.1"
eframe = "0.37.0"
fontdb = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
krilla = "0.8"
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
ttf-parser = "0.25"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlElement", "Node", "EventTarget", "HtmlCanvasElement", "Worker", "WorkerOptions", "WorkerType", "console", "PointerEvent"] }

[dev-dependencies]
roxmltree = "0.21.1"

# Used by cargo-mutants (see .cargo/mutants.toml): no debug info keeps each build small and quick.
[profile.mutants]
inherits = "test"
debug = "none"
