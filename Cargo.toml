[package]
name = "caprice-web"
version = "0.1.0"
edition = "2024"
publish = false

# theme-sdk/: what theme programs are written against (R36), tested with Caprice.
[workspace]
members = ["theme-sdk", "themes/played"]
default-members = [".", "theme-sdk", "themes/played"]

[dependencies]
base64 = "0.23.1"
eframe = "0.36.2"
fontdb = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
krilla = "0.8"
resvg = "0.50.0"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
ttf-parser = "0.25"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }
# Checking a theme program (R36): reading its sections, validating it against the fixed features,
# a version fixed so the check is the same in every build. And the gallery's signatures over modules.
wasmparser = { version = "=0.228.0", default-features = false, features = ["std", "validate", "features"] }
ed25519-compact = { version = "2.6.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }

[dev-dependencies]
# Modules written by hand for the check's tests; and the themes of `themes/` built for the machine
# against the SDK, to stand for their modules under `cargo test` (R36: no WebAssembly is run there).
wat = "1.263.0"
theme-sdk = { path = "theme-sdk", version = "1.0.0" }
themes-played = { path = "themes/played", version = "0.0.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.18.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlElement", "Node", "EventTarget", "HtmlCanvasElement", "Worker", "WorkerOptions", "WorkerType", "console", "PointerEvent", "MessageEvent", "ErrorEvent"] }

# The themes played in the tests in place of their modules (R36) are optimized, as their modules
# are: unoptimized, a frame of the Magic Vineyard took 32 ms, nearly the built-in one's own.
[profile.dev.package.themes-played]
opt-level = 3
[profile.dev.package.theme-sdk]
opt-level = 3
